schema_version: attribution-cues/0.3
lexicon_id: attribution-cues-v2

# Provenance cues read ONLY from deterministic structure: a table row label from the
# region index, a header cell of that table, its attached caption, or the frozen source
# manifest's title. No cue is ever supplied by a model.
#
# A decisive cue may demote a candidate out of the export gate. An abstaining cue may
# only route it to review. A cue graduates from abstaining to decisive only with a
# measured firing record over real row labels, recorded below.
#
# 0.2 adds two sections to the 0.1 layout: `abstaining_table_header_cues` match one
# header cell of the anchored table, and `abstaining_paper_context_cues` fire from the
# paper's title together with a table-level cue. Both are table-, caption- or
# paper-scoped signals: they never decide, they are recorded on every candidate
# anchored in the table, and only a row-scoped signal may still decide.
# `table_level_cues` names the header and caption cues that count as table-level for
# that trigger; a caption cue left off the list (such as `caption_reported`) is still
# recorded but never lets a paper-context cue fire.
#
# Examples below are invented strings that exercise each pattern. Aggregate firing
# counts come from a private development audit; source rows are intentionally absent.
#
# 0.3 adds `self_reference_row_cues`: a row label that names the paper itself ("Ours",
# "Our system", "This work"). It is the one row-scoped signal that speaks for the paper
# rather than against it. It never asserts paper production; it only stops the
# table- and paper-scoped cues from holding that row back, and they stay recorded on
# the verdict. Measured on a ten-paper rerun: seven reviewer-accepted own-system
# values in one shared-task paper sat in ranked tables and were withheld without it.

# A row label that refers to the paper itself. Row-scoped, so it may speak for its own
# row; it never decides paper production and leaves every table-scoped cue recorded.
self_reference_row_cues:
  - id: self_reference
    pattern: '^\s*(?:\(?ours?\)?|our (?:system|model|approach|submission|run|method|team)|this (?:work|paper)|proposed(?: (?:system|model|approach|method))?)\s*(?:\(.*\))?\s*$|\(ours\)'
    rationale: >-
      A label such as "Ours" or "Our system" can only mean the paper's own row. In a
      ranked or official-results table every other row abstains, but holding this row
      back as well withholds exactly the results the paper reports as its own.
    justifying_example: "Ours"
    justifying_source: private-development-audit
    measured_fires: 7
    measured_over_distinct_row_labels: 1193

# The cues that say the anchored table ranks or lists other parties' submissions.
table_level_cues:
  - rank_column
  - leaderboard_caption

decisive_row_cues:
  - id: leaderboard
    pattern: '\bleader(?:board)?s?\b'
    rationale: >-
      A leaderboard entry is by construction a score produced by whoever submitted it,
      not by the paper printing the table.
    justifying_example: "Example System (Leaderboard Entry)"
    justifying_source: private-development-audit
    measured_fires: 1
    measured_over_distinct_row_labels: 432

  - id: rank_marker
    pattern: '(?:#\s*\d{1,3}\b|\btop-?\d{1,3}\b|\b1st\b|\bwinner\b)'
    rationale: >-
      A rank in a row label names a position in someone else's ranking rather than a
      system the paper evaluated.
    justifying_example: "Example System #1"
    justifying_source: private-development-audit
    measured_fires: 1
    measured_over_distinct_row_labels: 432

  - id: attributed_author
    pattern: '\bet\s+al\.'
    rationale: >-
      An author name in a row label attributes the row to that author's work.
    justifying_example: "Example et al. [1]"
    justifying_source: private-development-audit
    measured_fires: 1
    measured_over_distinct_row_labels: 432

  - id: attributed_source
    pattern: '\b(?:as reported(?: in| by)?|taken from|reproduced from|reported by|copied from)\b'
    rationale: >-
      An explicit attributing phrase inside the row label names an external source.
    justifying_example: "Example Model (as reported in [1])"
    justifying_source: synthetic
    measured_fires: 0
    measured_over_distinct_row_labels: 432

# Abstaining cues route to review and never demote on their own. A bare citation
# bracket is the important case: measured over 432 distinct row labels it fires 10
# times, and the majority were dataset citations, where the citation names the dataset
# and not the origin of the number. It must never be decisive.
abstaining_row_cues:
  - id: citation_bracket
    pattern: '\[\d{1,3}(?:\s*,\s*\d{1,3})*\]'
    rationale: >-
      A citation inside a row label may attribute the result or merely cite the dataset
      or the model architecture. The two cannot be told apart from the label alone.
    justifying_example: "Example Dataset [1]"
    justifying_source: private-development-audit
    measured_fires: 10
    measured_over_distinct_row_labels: 432

  - id: prior_work
    pattern: '\b(?:prior|previous|earlier|original)\s+(?:work|paper|study|authors?|result)\b'
    rationale: >-
      Names earlier work, but a paper may also re-run earlier work itself.
    justifying_example: "prior work"
    justifying_source: synthetic
    measured_fires: 0
    measured_over_distinct_row_labels: 432

# Caption cues never decide. A caption covers every row and may mix a phrase about
# externally reported results with a phrase about the current paper's own system.
abstaining_caption_cues:
  - id: caption_reported
    pattern: '\b(?:reported|published|leaderboard)\b'
    rationale: >-
      Signals that the table carries numbers the paper did not produce, without saying
      which rows.
    justifying_example: "Table 1. Reported benchmark performance."
    justifying_source: synthetic
  - id: caption_attributed
    pattern: '\b(?:as reported(?: in| by)?|taken from|reproduced from|from the .{0,24}paper)\b'
    rationale: >-
      An explicit attributing phrase in a caption.
    justifying_example: "results reproduced from the earlier paper"
    justifying_source: synthetic
  - id: leaderboard_caption
    pattern: 'official (?:results|ranking)|participating (?:systems|teams)|shared[- ]task results|leaderboard|final (?:ranking|results)|systems? ranking|top[- ]\d+ systems'
    rationale: >-
      A caption describing an official ranking or the participating systems of a shared
      task says the table lists other parties' submissions. Which row is the paper's
      own cannot be read from the caption, so it abstains for every row.
    justifying_example: "Table 3: Official results of the shared task, top-5 systems."
    justifying_source: private-development-audit
    measured_fires: 3
    measured_over_distinct_captions: 191

# Header cues match one header cell of the anchored table, split on the layout's own
# column gutters. A rank column indexes a ranking of submissions, which is why it
# abstains for every row of the table rather than deciding any single row.
abstaining_table_header_cues:
  - id: rank_column
    pattern: '^(?:rank|#|pos\.?|position|place)$'
    rationale: >-
      A column that ranks the rows lists a competition's standings. The paper may own
      one of those rows, and the header cannot say which.
    justifying_example: "Rank"
    justifying_source: private-development-audit
    measured_fires: 3
    measured_over_distinct_header_cells: 679

# Paper-context cues combine the frozen manifest title with one of the
# `table_level_cues` above. They need the paper kind the title implies and never fire
# in a table without such a cue; a title alone says nothing about any one row. They
# are recorded under the `paper_context` scope, never under `row_label`.
abstaining_paper_context_cues:
  - id: foreign_team_row
    paper_kind: shared_task_system_paper
    pattern: '^(?:ours?|our (?:system|model|approach|submission|run)|this (?:work|paper)|proposed|submitted|run \d+|submission \d+|baseline)$'
    rationale: >-
      In a system-description paper, a row of a ranked or official-results table whose
      label neither names the team from the title nor refers to the paper itself most
      likely belongs to another participant. The pattern lists the self-referential
      labels that are exempt; a label containing the team name is exempt as well.
      Measured over the distinct trusted row labels of tables that carry a
      `rank_column` or `leaderboard_caption` cue in shared-task system papers.
    justifying_example: "Other Team"
    justifying_source: private-development-audit
    measured_fires: 21
    measured_over_distinct_row_labels: 22

  - id: overview_paper_rows
    paper_kind: overview_paper
    rationale: >-
      A shared-task overview reports every participant's results. Rows of a ranked or
      official-results table in such a paper are the participants' numbers.
    justifying_example: "Overview of the Example Shared Task"
    justifying_source: synthetic
    measured_fires: 0
    measured_over_distinct_row_labels: 0
